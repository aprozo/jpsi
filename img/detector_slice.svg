<svg xmlns="http://www.w3.org/2000/svg" width="900" height="385" viewBox="0 0 900 385" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="900" height="385" fill="white"/>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#222">A slice of CMS, from the collision point outwards</text>
<rect x="90" y="50" width="115" height="212" fill="#e6e6e6" stroke="#777" stroke-width="1"/>
<rect x="205" y="50" width="70" height="212" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
<rect x="275" y="50" width="100" height="212" fill="#c5d8f0" stroke="#1f5fbf" stroke-width="1"/>
<rect x="375" y="50" width="35" height="212" fill="#ffe0b2" stroke="#c9541c" stroke-width="1"/>
<rect x="410" y="50" width="290" height="212" fill="#f0f0f0" stroke="#777" stroke-width="1"/>
<rect x="440" y="50" width="14" height="212" fill="#f8c0bc" stroke="#d1352b" stroke-width="1"/>
<rect x="505" y="50" width="14" height="212" fill="#f8c0bc" stroke="#d1352b" stroke-width="1"/>
<rect x="570" y="50" width="14" height="212" fill="#f8c0bc" stroke="#d1352b" stroke-width="1"/>
<rect x="635" y="50" width="14" height="212" fill="#f8c0bc" stroke="#d1352b" stroke-width="1"/>
<text x="147" y="280" text-anchor="middle" fill="#333" font-weight="bold">tracker</text>
<text x="147" y="296" text-anchor="middle" fill="#555" font-size="11">measures pT</text>
<text x="240" y="280" text-anchor="middle" fill="#333" font-weight="bold">ECAL</text>
<text x="240" y="296" text-anchor="middle" fill="#555" font-size="11">electrons and</text><text x="240" y="309" text-anchor="middle" fill="#555" font-size="11">photons stop</text>
<text x="325" y="280" text-anchor="middle" fill="#333" font-weight="bold">HCAL</text>
<text x="325" y="296" text-anchor="middle" fill="#555" font-size="11">hadrons stop</text>
<text x="392" y="280" text-anchor="middle" fill="#333" font-weight="bold">coil</text>
<text x="392" y="296" text-anchor="middle" fill="#555" font-size="11">3.8 T</text>
<text x="555" y="280" text-anchor="middle" fill="#333" font-weight="bold">iron + muon chambers</text>
<text x="555" y="296" text-anchor="middle" fill="#555" font-size="11">only muons get this far</text>
<circle cx="60" cy="156" r="5" fill="#222"/><text x="60" y="180" text-anchor="middle" fill="#222" font-size="12">collision</text>
<path d="M60,156 Q250,155 410,100 Q520,62 700,122" fill="none" stroke="#1f5fbf" stroke-width="3"/>
<text x="708" y="100" fill="#1f5fbf" font-weight="bold" font-size="14">muon</text>
<text x="708" y="116" fill="#1f5fbf" font-size="11">seen in the tracker</text><text x="708" y="130" fill="#1f5fbf" font-size="11">and in the muon chambers</text>
<text x="708" y="150" fill="#1f5fbf" font-size="11">bends back: the field in</text><text x="708" y="164" fill="#1f5fbf" font-size="11">the iron points the other way</text>
<path d="M60,156 Q140,150 215,118" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
<ellipse cx="240" cy="108" rx="24" ry="14" fill="#2e7d32" fill-opacity="0.35"/>
<text x="240" y="86" text-anchor="middle" fill="#2e7d32" font-size="12">electron</text>
<path d="M60,156 Q190,166 288,142" fill="none" stroke="#c9541c" stroke-width="2.5"/>
<ellipse cx="322" cy="136" rx="34" ry="16" fill="#c9541c" fill-opacity="0.35"/>
<text x="322" y="170" text-anchor="middle" fill="#c9541c" font-size="12">pion (hadron)</text>
<path d="M60,156 L215,204" fill="none" stroke="#8a6410" stroke-width="2" stroke-dasharray="6 4"/>
<ellipse cx="240" cy="212" rx="24" ry="14" fill="#8a6410" fill-opacity="0.35"/>
<text x="240" y="244" text-anchor="middle" fill="#8a6410" font-size="12">photon</text>
<text x="150" y="222" text-anchor="middle" fill="#8a6410" font-size="11">no charge: straight,</text><text x="150" y="236" text-anchor="middle" fill="#8a6410" font-size="11">no track in the tracker</text>
<text x="20" y="346" fill="#333" font-size="12">Charged particles curve in the magnetic field; how much they curve gives their momentum. Neutral ones go straight.</text>
<text x="20" y="364" fill="#333" font-size="12">In the data file, type G (global) = a muon seen in the tracker and the muon chambers; type T = seen in the tracker only.</text>
</svg>