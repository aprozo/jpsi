<svg xmlns="http://www.w3.org/2000/svg" width="560" height="295" viewBox="0 0 560 295" font-family="Helvetica, Arial, sans-serif" font-size="17">
  <defs>
    <marker id="fa" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#222"/></marker>
  </defs>
  <rect width="560" height="295" fill="white"/>

  <!-- the bound state -->
  <ellipse cx="135" cy="135" rx="105" ry="78" fill="#e8b23a" fill-opacity="0.15" stroke="#b07f10" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="135" y="232" text-anchor="middle" fill="#8a6410" font-size="15">J/ψ = a charm quark and its antiquark</text>
  <text x="135" y="252" text-anchor="middle" fill="#8a6410" font-size="15">mass 3.097 GeV/c²</text>

  <!-- quark lines with mid arrows -->
  <line x1="60" y1="85" x2="130" y2="110" stroke="#222" stroke-width="2.2"/>
  <line x1="130" y1="110" x2="200" y2="135" stroke="#222" stroke-width="2.2" marker-start="url(#fa)"/>
  <line x1="200" y1="135" x2="130" y2="160" stroke="#222" stroke-width="2.2" marker-end="url(#fa)"/>
  <line x1="130" y1="160" x2="60" y2="185" stroke="#222" stroke-width="2.2"/>
  <text x="42" y="80" fill="#222" font-style="italic">c</text>
  <text x="40" y="200" fill="#222" font-style="italic">c</text>
  <line x1="40" y1="184" x2="50" y2="184" stroke="#222" stroke-width="1.5"/>

  <!-- photon (wavy line) -->
  <path d="M200,135 q8,-13 16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0" fill="none" stroke="#2a8f3c" stroke-width="2.2"/>
  <text x="264" y="112" text-anchor="middle" fill="#2a8f3c" font-size="15">photon γ</text>

  <!-- muons -->
  <line x1="328" y1="135" x2="410" y2="80" stroke="#1f5fbf" stroke-width="2.2" marker-end="url(#fa)"/>
  <line x1="410" y1="80" x2="490" y2="26" stroke="#1f5fbf" stroke-width="2.2"/>
  <line x1="490" y1="244" x2="410" y2="190" stroke="#1f5fbf" stroke-width="2.2" marker-end="url(#fa)"/>
  <line x1="410" y1="190" x2="328" y2="135" stroke="#1f5fbf" stroke-width="2.2"/>
  <text x="500" y="30" fill="#1f5fbf" font-size="19">μ<tspan font-size="13" dy="-8">−</tspan></text>
  <text x="500" y="252" fill="#1f5fbf" font-size="19">μ<tspan font-size="13" dy="-8">+</tspan></text>
  <text x="440" y="145" text-anchor="middle" fill="#555" font-size="13">the two muons</text>
  <text x="440" y="162" text-anchor="middle" fill="#555" font-size="13">CMS measures</text>

  <text x="280" y="284" text-anchor="middle" fill="#444" font-size="13">the J/ψ lives only 10<tspan font-size="9" dy="-6">−20</tspan><tspan dy="6"> s and never reaches the detector: we only see the two muons</tspan></text>
</svg>
